apiVersion: apps/v1
kind: Deployment
metadata:
  name: platformpilot-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platformpilot-api
  template:
    metadata:
      labels:
        app: platformpilot-api
    spec:
      containers:
        - name: platformpilot-api
          image: platformpilot-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
